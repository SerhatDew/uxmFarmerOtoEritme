name: uxmFarmerOtoEritme
version: '${project.version}'
main: com.blokoyun.hooks.farmersmelt.UxmFarmerAutoSmeltPlugin
api-version: '1.21.1'
authors:
  - BlokOyun
description: UXMFarmer toplama olayları için config tabanlı otomatik eritme ve komut hook'u.
softdepend:
  - uxmFarmer
  - Farmer
commands:
  uxmfarmerotosmelter:
    description: UXMFarmer otomatik eritme ayarlarını yeniler.
    aliases: [farmerotosmelter, otoeritme]
    permission: uxmfarmerotosmelter.admin
permissions:
  uxmfarmerotosmelter.use:
    description: Farmer GUI içinden oto eritme başlatma yetkisi.
    default: op
  uxmfarmerotosmelter.admin:
    description: Oto eritme yapılandırmasını yenileme yetkisi.
    default: op
  uxmfarmerotosmelter.auto:
    description: Sahibinin Farmer deposunda otomatik eritme çalıştırma yetkisi.
    default: false
  uxmfarmerotosmelter.instant:
    description: Manuel ve otomatik eritmede işlem süresini atlama yetkisi.
    default: false
