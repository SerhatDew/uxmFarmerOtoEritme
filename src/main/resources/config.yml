config-version: 1
enabled: true
trigger: click # click = sadece farmer GUI düğmesi, automatic = toplama event'i

# UXMFarmer sınıflarına derleme zamanında bağlanılmaz.
# Hook, olay sınıfını çalışma anında yüklediği için UXMFarmer güncellemelerinde
# bağımlılık sürümünü değiştirmek gerekmez.
hook:
  plugin-name: uxmFarmer
  event-class: com.uxplima.uxmfarmer.api.event.impl.FarmerCollectProductEvent
  priority: NORMAL

# Bir eşleşen kuralda belirtilmeyen alanlar burada kullanılır.
defaults:
  mode: plugin # plugin: ürünü UXMFarmer depolasın, commands: aşağıdaki komutları çalıştır
  min-amount: 1
  max-amount: 0 # 0 = sınırsız
  consume: false # commands modunda ürünü UXMFarmer deposuna ekleme
  permission: ''
  commands: []

gui:
  enabled: true
  slot: 7
  rows: 6
  duration-seconds: 10
  batch-size: 64 # 0 = depodaki uygun miktarın tamamı
  permission: uxmfarmerotosmelter.use
  button:
    material: BLAST_FURNACE
    name: '&6ᴏᴛᴏ ᴇʀɪᴛᴍᴇ'
    lore:
      - ''
      - '&7ᴜʀᴜɴ ᴍᴇɴᴜsᴜɴᴜ ᴀᴄᴍᴀᴋ ɪᴄɪɴ ᴛɪᴋʟᴀ'
      - ''
      - '&eᴇʀɪᴛᴍᴇ ᴍᴇɴᴜsᴜ ɪᴄɪɴ ᴛɪᴋʟᴀ'
  progress:
    name: '&6ᴇʀɪᴛɪʟɪʏᴏʀ'
    bar-length: 20

# Anahtarlar Bukkit Material adlarıdır. Büyük/küçük harf fark etmez.
items:
  RAW_IRON:
    mode: commands
    min-amount: 1
    consume: true
    commands:
      - 'give %player% iron_ingot %amount%'
  IRON_ORE:
    mode: commands
    min-amount: 1
    consume: true
    commands:
      - 'give %player% iron_ingot %amount%'
  GOLD_ORE:
    mode: commands
    min-amount: 1
    consume: true
    commands:
      - 'give %player% gold_ingot %amount%'
